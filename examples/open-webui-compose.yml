# Boots TimbreGrid + Open WebUI together for a one-command integration check.
#
# Usage:
#   docker compose -f examples/open-webui-compose.yml up --build
#
# Then open http://localhost:3000 to use Open WebUI. From the host, run
#   timbregrid doctor http://127.0.0.1:8889/v1
# to confirm `open_webui_tts: ready` before relying on the integration.
#
# This example uses the fake:tts adapter so it works with no model downloads.
# Swap TIMBREGRID_MODEL and AUDIO_TTS_MODEL/AUDIO_TTS_VOICE for KittenTTS or
# Kokoro once those optional dependencies are installed in the timbregrid image.

services:
  timbregrid:
    build:
      context: ../
    image: timbregrid:local
    environment:
      TIMBREGRID_MODEL: fake:tts
      TIMBREGRID_HOST: 0.0.0.0
      TIMBREGRID_PORT: "8889"
    ports:
      - "8889:8889"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - timbregrid
    environment:
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://timbregrid:8889/v1
      - AUDIO_TTS_OPENAI_API_KEY=local
      - AUDIO_TTS_MODEL=fake:tts
      - AUDIO_TTS_VOICE=alloy
      - AUDIO_TTS_OPENAI_PARAMS={"response_format":"wav"}
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:

schema_version: "0.1"
id: chatterbox:tts
name: Chatterbox TTS
upstream:
  homepage: https://github.com/resemble-ai/chatterbox
  license: mit
  weights: https://huggingface.co/ResembleAI/chatterbox
runtime:
  kind: python
  package: chatterbox-tts
  acceleration:
    cpu: false
    cuda: true
    metal: false
capabilities:
  streaming: false
  voice_cloning: true
  multilingual: full
  long_form: limited
  style_control: [exaggeration, cfg_weight, paralinguistic_tags]
  formats: [wav, pcm]
audio:
  sample_rate_hz: 24000
  formats: [wav, pcm]
voices:
  builtin: false
  custom: true
policy:
  commercial_use: true
  requires_voice_consent: true
notes:
  - "Manifest-only example for expressive and cloning-oriented TTS."
  - "Chatterbox outputs include Resemble AI PerTh watermarking in official examples."

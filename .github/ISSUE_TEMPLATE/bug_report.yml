name: Bug report
description: Report a reproducible problem in TimbreGrid.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: List the exact commands or request payload needed to reproduce the issue.
      placeholder: |
        1. Run `uv run ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TimbreGrid version or commit
      placeholder: "0.1.0 or commit SHA"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, uv version, optional extras, Docker usage, and relevant model dependencies.
      placeholder: |
        OS:
        Python:
        uv:
        Command:
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. Do not include secrets, private voice samples, or private dataset paths.
      render: text

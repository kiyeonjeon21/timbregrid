name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check optional dependency resolution
        run: uv sync --all-groups --extra kitten --extra kokoro --dry-run

      - name: Run tests
        run: uv run pytest

      - name: Validate manifests
        run: |
          for manifest in manifests/*.yaml; do
            uv run timbregrid manifest validate "$manifest"
          done

      - name: Check registry artifacts
        run: uv run timbregrid registry build --check

      - name: Validate benchmark artifacts
        run: |
          for benchmark_dir in benchmarks/examples benchmarks/submissions; do
            for benchmark in "$benchmark_dir"/*.json; do
              test -e "$benchmark" || continue
              uv run timbregrid bench validate "$benchmark"
            done
          done

      - name: Run benchmark smoke test
        run: |
          uv run timbregrid bench fake:tts \
            --suite realtime-agent \
            --hardware-profile generic-ci \
            --output /tmp/timbregrid-bench.json
          uv run timbregrid bench validate /tmp/timbregrid-bench.json

  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install CLI dependencies
        run: uv sync --all-groups

      - name: Build Docker image
        run: docker build -t timbregrid:ci .

      - name: Run Docker gateway
        run: docker run --rm -d --name timbregrid-ci -p 8889:8889 timbregrid:ci

      - name: Wait for gateway
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8889/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs timbregrid-ci
          exit 1

      - name: Smoke speech endpoint
        run: |
          curl -fsS -o /tmp/timbregrid-docker.wav \
            http://127.0.0.1:8889/v1/audio/speech \
            -H "Content-Type: application/json" \
            -d '{"model":"fake:tts","input":"Hello from Docker","voice":"alloy","response_format":"wav"}'
          test -s /tmp/timbregrid-docker.wav

      - name: Run conformance against Docker gateway
        run: |
          uv run timbregrid conformance http://127.0.0.1:8889/v1 \
            --model fake:tts \
            --voice alloy \
            --response-format wav \
            --output /tmp/timbregrid-docker-conformance.json

      - name: Stop Docker gateway
        if: always()
        run: docker stop timbregrid-ci || true

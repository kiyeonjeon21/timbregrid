name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Validate manifests
        run: |
          uv run timbregrid manifest validate manifests/fake-tts.yaml
          uv run timbregrid manifest validate manifests/kokoro-82m.yaml

      - name: Run benchmark smoke test
        run: uv run timbregrid bench fake:tts --suite realtime-agent --output /tmp/timbregrid-bench.json

name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish to PyPI"
        required: true
        default: "v0.1.0-alpha.2"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Check registry artifacts
        run: uv run timbregrid registry build --check

      - name: Audit registry metadata
        run: uv run timbregrid registry audit --timeout 5

      - name: Build Python artifacts
        run: uv build --out-dir dist --clear

      - name: Check PyPI-compatible wheel metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              print(f"Expected exactly one wheel, found {len(wheels)}", file=sys.stderr)
              sys.exit(1)

          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_name = next(
                  name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = wheel.read(metadata_name).decode()

          bad = [
              line
              for line in metadata.splitlines()
              if line.startswith("Requires-Dist:")
              and any(token in line for token in (" @ http://", " @ https://", " @ file://", " @ git+"))
          ]
          if bad:
              print("PyPI package metadata contains direct URL dependencies:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

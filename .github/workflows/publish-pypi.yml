name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish to PyPI"
        required: true
        default: "v0.1.0-alpha.1"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Check registry artifacts
        run: uv run timbregrid registry build --check

      - name: Audit registry metadata
        run: uv run timbregrid registry audit --timeout 5

      - name: Check PyPI-compatible dependency metadata
        run: |
          if grep -nE ' @ ((https?|file)://|git\+)' pyproject.toml; then
            echo "PyPI does not accept published distributions with direct URL dependencies." >&2
            echo "Move direct wheel installs to docs or a non-published dependency group before publishing." >&2
            exit 1
          fi

      - name: Build Python artifacts
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
